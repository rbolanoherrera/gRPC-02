syntax = "proto3";

option csharp_namespace = "GrpcMantenimiento";

package persona;

message PersonaDTO {
	string nombre = 2;
	string apellido = 3;
	string email = 4;
}

message PersonaRequest {
	PersonaDTO persona = 1;
}

message PersonaResponse {
	string code = 1;
	string message = 2;
}

service PersonaSvc {
	//gRPC Unary
	rpc RegistrarPersona (PersonaRequest) returns (PersonaResponse);
}